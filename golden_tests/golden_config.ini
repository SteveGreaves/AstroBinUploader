# Frozen configuration for the golden regression harness.
#
# golden_tests/run_golden.py passes this file via --config so the corpus is
# reproducible on any checkout. Before this existed the harness used the
# repo's gitignored config.ini, which meant the committed references only
# reproduced on the maintainer's machine -- a fresh clone failed 2/2.
#
# DO NOT EDIT without re-blessing the references (run_golden.py --bless):
# every value here is baked into golden_tests/references/. The dead
# 'SWCREATOR' override and the stray 'ROTATANG' default are deliberate --
# they exercise the no-op warning path and are part of what was blessed.
#
# The [secret] section from the maintainer's config is omitted: nothing in
# the summary/CSV path reads it (B15 in REMEDIATION_PLAN.md).

[defaults]
        IMAGETYP = LIGHT
        EXPOSURE = 0
        DATE-OBS = 2023-01-01
        XBINNING = 1
        GAIN = -1
        EGAIN = -1
        INSTRUME = None
        TELESCOP = None
        FOCNAME = None
        FWHEEL = None
        ROTNAME = None
        ROTANTANG = 0
        XPIXSZ = 3
        CCD-TEMP = -10
        FOCALLEN = 540
        FOCRATIO = 5
        SITE = Papworth Everard
        SITELAT = 52.2484
        SITELONG = -0.1231
        BORTLE = 4
        SQM = 21
        FILTER = No Filter
        OBJECT = No target
        FOCTEMP = 20
        HFR = 1
        FWHM = 0
        SWCREATE = Unknown package
        USEOBSDATE = False
        ROTATANG = 0
[override]
        SWCREATOR = CREATOR
        EXPOSURE = EXPTIME
        SITE = SITENAME
        FOCNAME = FOCUSER
        SQM = AOCSKYQ, AOCSKYQU
        FOCTEMP = AOCAMBT
[filters]
